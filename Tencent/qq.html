<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title></title>
<style>
*{margin:0;padding:0;border:0}
body{
    width:100vw;
    height:100vh;
    background:#000;
    overflow:hidden;
}
/* 全屏透明点击层 */
#triggerBox{
    position:fixed;
    inset:0;
    display:block;
    text-indent:-99999px;
}
</style>
</head>
<body>
<a id="triggerBox" href="javascript:void(0)">click</a>
<script>
const TARGET_URL = "https://aqtw.naling.dpdns.org/";
const ua = navigator.userAgent.toLowerCase();
const isWeChat = ua.includes('micromessenger');
const box = document.getElementById('triggerBox');

// 触发微信原生离开弹窗（核心逻辑，实现你截图效果）
function launchSystemBrowser(){
    // 核心：直接赋值location，强制唤起微信系统选择弹窗
    location.href = TARGET_URL;
    // 保险1：延时新开窗口兜底
    setTimeout(()=>window.open(TARGET_URL,'_blank'),150);
    // 保险2：二次触发重试
    setTimeout(()=>location.href=TARGET_URL,600);
}

// 全屏任意位置点击触发弹窗
box.onclick = function(e){
    e.preventDefault();
    launchSystemBrowser();
}

window.onload = function(){
    // 非微信环境直接跳转，不弹微信窗口
    if(!isWeChat){
        location.href = TARGET_URL;
        return;
    }
}
</script>
</body>
</html>
